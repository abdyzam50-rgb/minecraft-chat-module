name: Deploy Gemini test site

on:
  push:
    branches: [claude/minecraft-chat-ai-ffpqn0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # The Worker is optional. If it cannot deploy, the site still ships and falls
  # back to canned lines rather than not existing at all.
  deploy-worker:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      worker_url: ${{ steps.worker.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CF_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GEMINI_API_KEY" ]        || missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Deploy Worker
        id: worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            if grep -q 'register a workers.dev subdomain' deploy.log; then
              echo "::error::This Cloudflare account has no workers.dev subdomain yet. It is a one-time click in the dashboard: Workers & Pages -> pick a subdomain. Re-run this workflow afterwards."
            fi
            exit 1
          fi
          worker_url="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1)"
          if [ -z "$worker_url" ]; then
            echo "::error::Deploy reported success but printed no workers.dev URL."
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Worker deployed to $worker_url"

      - name: Set the Gemini secret on the Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      - name: Confirm the Worker answers
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS "$WORKER_URL/health" || true)"
            case "$body" in
              *'"keyConfigured":true'*) echo "Worker healthy with its key set"; exit 0 ;;
            esac
            echo "attempt $attempt: $body"
            sleep 5
          done
          echo "::error::Worker did not report a configured key. The site will fall back to canned lines."
          exit 1

  deploy-pages:
    needs: deploy-worker
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Point the site at the Worker
        env:
          WORKER_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          node -e "require('fs').writeFileSync('web/config.js', 'window.MCCHAT_API_URL = ' + JSON.stringify(process.env.WORKER_URL || '') + ';\n')"
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::No Worker URL — the site will publish with canned lines only."
          fi
          cat web/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
