name: Deploy test site

on:
  push:
    branches: [claude/minecraft-chat-ai-ffpqn0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CF_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GEMINI_API_KEY" ]        || missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Stage the site for the Worker to serve
        run: |
          rm -rf cloudflare-worker/public
          cp -r web cloudflare-worker/public
          # Page and API are the same origin now, so it does not need naming.
          cat > cloudflare-worker/public/config.js <<'JS'
          // Served by the Worker, so the API is this same origin.
          window.MCCHAT_API_URL = location.origin;
          JS
          # chat-sandbox.html is an Artifact *source*: no doctype and no head,
          # because the platform supplies them. Served raw it has no charset, so
          # the browser reads UTF-8 as Latin-1 and every dash and emoji breaks.
          # Wrap it for this host, and serve it at / with no redirect hop.
          node web/build-standalone.mjs web/chat-sandbox.html cloudflare-worker/public/index.html
          cp cloudflare-worker/public/index.html cloudflare-worker/public/chat-sandbox.html
          grep -q '<meta charset="utf-8">' cloudflare-worker/public/index.html
          ls -1 cloudflare-worker/public

      - name: Deploy Worker and site
        id: worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            if grep -q 'register a workers.dev subdomain' deploy.log; then
              echo "::error::This Cloudflare account has no workers.dev subdomain yet. It is a one-time click: dashboard -> Workers & Pages -> pick a subdomain. Re-run afterwards."
            fi
            exit 1
          fi
          worker_url="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1)"
          if [ -z "$worker_url" ]; then
            echo "::error::Deploy succeeded but printed no workers.dev URL."
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Set the Gemini secret
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      - name: Check the deployed site answers
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6; do
            health="$(curl -fsSL "$WORKER_URL/health" || true)"
            page="$(curl -fsSL -o /dev/null -w '%{http_code}' "$WORKER_URL/" || true)"
            charset="$(curl -fsSL "$WORKER_URL/" | grep -c 'meta charset="utf-8"' || true)"
            echo "attempt $attempt: health=$health page=$page charset=$charset"
            case "$health:$page:$charset" in
              *'"keyConfigured":true'*:200:1) ok=1; break ;;
            esac
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::Site or API did not come up."; exit 1; }
          echo "### Test site" >> "$GITHUB_STEP_SUMMARY"
          echo "$WORKER_URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: $WORKER_URL/"
