name: Deploy Gemini test site

on:
  push:
    branches: [claude/minecraft-chat-ai-ffpqn0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.worker.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        id: worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          worker_url="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1)"
          test -n "$worker_url"
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Set the Gemini secret on the Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure the public Worker URL
        env:
          WORKER_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: node -e "require('fs').writeFileSync('web/config.js', 'window.MCCHAT_API_URL = ' + JSON.stringify(process.env.WORKER_URL) + ';\\n')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
