name: Deploy test site

on:
  push:
    branches: [claude/minecraft-chat-ai-ffpqn0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CF_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          # Either upstream will do. The Worker prefers Gemini when both are
          # set, unless LLM_PROVIDER in wrangler.jsonc says otherwise.
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$TOKENROUTER_API_KEY" ]; then
            missing="$missing GEMINI_API_KEY-or-TOKENROUTER_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Check the page is in sync with the knowledge file
        run: node web/build-sandbox.mjs --check

      - name: Stage the site for the Worker to serve
        run: |
          rm -rf cloudflare-worker/public
          cp -r web cloudflare-worker/public
          # Page and API are the same origin now, so it does not need naming.
          cat > cloudflare-worker/public/config.js <<'JS'
          // Served by the Worker, so the API is this same origin.
          window.MCCHAT_API_URL = location.origin;
          JS
          # chat-sandbox.html is an Artifact *source*: no doctype and no head,
          # because the platform supplies them. Served raw it has no charset, so
          # the browser reads UTF-8 as Latin-1 and every dash and emoji breaks.
          # Wrap it for this host, and serve it at / with no redirect hop.
          node web/build-standalone.mjs web/chat-sandbox.html cloudflare-worker/public/index.html
          cp cloudflare-worker/public/index.html cloudflare-worker/public/chat-sandbox.html
          grep -q '<meta charset="utf-8">' cloudflare-worker/public/index.html
          ls -1 cloudflare-worker/public

      - name: Deploy Worker and site
        id: worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            if grep -q 'register a workers.dev subdomain' deploy.log; then
              echo "::error::This Cloudflare account has no workers.dev subdomain yet. It is a one-time click: dashboard -> Workers & Pages -> pick a subdomain. Re-run afterwards."
            fi
            exit 1
          fi
          worker_url="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1)"
          if [ -z "$worker_url" ]; then
            echo "::error::Deploy succeeded but printed no workers.dev URL."
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Set the upstream API keys
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
        run: |
          # Whichever are configured. Setting both is fine and makes switching
          # provider a wrangler.jsonc edit rather than a secrets change.
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          fi
          if [ -n "$TOKENROUTER_API_KEY" ]; then
            printf '%s' "$TOKENROUTER_API_KEY" | npx wrangler secret put TOKENROUTER_API_KEY
          fi

      - name: Check the deployed site answers
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6; do
            health="$(curl -fsSL "$WORKER_URL/health" || true)"
            page="$(curl -fsSL -o /dev/null -w '%{http_code}' "$WORKER_URL/" || true)"
            charset="$(curl -fsSL "$WORKER_URL/" | grep -c 'meta charset="utf-8"' || true)"
            echo "attempt $attempt: health=$health page=$page charset=$charset"
            case "$health:$page:$charset" in
              *'"keyConfigured":true'*:200:1) ok=1; break ;;
            esac
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::Site or API did not come up."; exit 1; }

          # keyConfigured only proves a secret exists. A key the upstream
          # rejects passed this check and shipped a site that could not answer
          # anything, so spend one real request proving it can.
          #
          # What counts as a pass is the distinction that matters: a reply, or
          # an upstream that accepted our credentials and is merely busy. A
          # 429 means the wiring is right and the free window is spent — and
          # this probe is itself one of the requests that spends it. Only a
          # refusal (bad key, retired model, wrong URL) is a broken deploy.
          reply="$(curl -sS -X POST "$WORKER_URL/api/reply" \
            -H 'content-type: application/json' \
            -d '{"prompt":"Reply as JSON with fields respond (boolean), message (string), reason (string). Set message to the single word ok."}' || true)"
          echo "reply=$reply"
          case "$reply" in
            *'"message"'*)
              echo "The API answered." ;;
            *429*|*[Qq]uota*|*rate\ limit*|*RESOURCE_EXHAUSTED*)
              echo "::warning::Upstream is rate limited, so the reply path is wired but unproven: $reply" ;;
            *)
              echo "::error::The API is reachable but refused to answer: $reply"; exit 1 ;;
          esac
          echo "### Test site" >> "$GITHUB_STEP_SUMMARY"
          echo "$WORKER_URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: $WORKER_URL/"
